<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Social Event Invitation</title>
  </head>
  <body
    style="
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 32px;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
      "
    >
      <div
        style="
          background: linear-gradient(135deg, #2563eb, #4f46e5);
          padding: 32px;
          text-align: center;
        "
      >
        <h1 style="color: #fff; margin: 0; font-size: 24px">
          Social Event Manager
        </h1>
      </div>
      <div style="padding: 32px">
        <h2 style="color: #111827; font-size: 22px; margin: 0 0 8px">
          ¡Bienvenido, {{firstName}}! 🎉
        </h2>
        <p style="color: #6b7280; font-size: 14px; margin: 0 0 24px">
          Tu cuenta fue creada exitosamente. Ahora podés crear eventos, invitar
          personas y gestionar contribuciones en un solo lugar.
        </p>
        <a
          href="{{dashboardUrl}}"
          style="
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
          "
        >
          Ir al Dashboard
        </a>
      </div>
      <div
        style="
          padding: 16px 32px;
          border-top: 1px solid #e5e7eb;
          text-align: center;
        "
      >
        <p style="color: #9ca3af; font-size: 12px; margin: 0">
          Social Event Manager · Si no creaste esta cuenta, ignorá este email.
        </p>
      </div>
    </div>
  </body>
</html>
