server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: social-event-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Argentina/Buenos_Aires

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 #1 hour
