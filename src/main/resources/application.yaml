server:
  port: 8080

spring:
  application:
    name: social-event-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Argentina/Buenos_Aires

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 #1 hour

  localhost:5433/social_event_manager