services:
  postgres:
    image: postgres:16
    container_name: social-event-db
    restart: always
    environment:
      POSTGRES_DB: social_event_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: